<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Jute Tote Bag -->
  <!-- Handles -->
  <path d="M 140 160 C 140 70 260 70 260 160" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round" />
  <!-- Bag Body -->
  <path d="M 100 160 L 115 330 L 285 330 L 300 160 Z" fill="#d97706" stroke="#b45309" stroke-width="2" />
  <!-- Jute Crosshatch weave texture -->
  <line x1="120" y1="180" x2="280" y2="180" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="115" y1="220" x2="285" y2="220" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="115" y1="260" x2="285" y2="260" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="120" y1="300" x2="280" y2="300" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="6 4" />
  <!-- Leather Base Corner Patches -->
  <polygon points="115,300 145,330 115,330" fill="#78350f" />
  <polygon points="285,300 255,330 285,330" fill="#78350f" />
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#fef3c7" />
  <text x="62" y="36" fill="#92400e" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">ECO JUTE TOTE</text>
</svg>
