<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Baseball Cap (Side Profile) -->
  <g transform="translate(60, 110)">
    <!-- Cap Crown -->
    <path d="M 60 180 C 60 90 190 80 220 180 Z" fill="#334155" stroke="#1e293b" stroke-width="2.5" />
    <!-- Panel Seam -->
    <path d="M 140 85 Q 160 130 160 180" fill="none" stroke="#64748b" stroke-width="1.5" />
    <!-- Top Button -->
    <circle cx="140" cy="85" r="7" fill="#1e293b" />
    <!-- Curved Visor / Brim -->
    <path d="M 215 170 C 260 170 300 200 310 205 C 290 215 220 200 195 180 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    <!-- Embroidered Eyelets -->
    <circle cx="100" cy="130" r="3" fill="#64748b" />
    <circle cx="180" cy="130" r="3" fill="#64748b" />
  </g>
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#f1f5f9" />
  <text x="62" y="36" fill="#334155" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">COTTON CAP</text>
</svg>

