<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#heroBg)" />

  <!-- Background decorative shapes -->
  <circle cx="1050" cy="120" r="180" fill="#fecdd3" opacity="0.35" />
  <circle cx="900" cy="380" r="140" fill="#fed7aa" opacity="0.3" />
  <rect x="750" y="80" width="380" height="340" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.85" />

  <!-- Clothes Rack Illustration on Right -->
  <g transform="translate(800, 110)">
    <!-- Rack Bar -->
    <line x1="20" y1="60" x2="260" y2="60" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="60" x2="40" y2="280" stroke="#64748b" stroke-width="5" />
    <line x1="240" y1="60" x2="240" y2="280" stroke="#64748b" stroke-width="5" />
    <!-- Rack base feet -->
    <line x1="15" y1="280" x2="65" y2="280" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <line x1="215" y1="280" x2="265" y2="280" stroke="#334155" stroke-width="6" stroke-linecap="round" />

    <!-- Hanging Hanger 1: Shirt -->
    <path d="M 65 60 C 65 52 75 52 75 60" fill="none" stroke="#e11d48" stroke-width="2" />
    <path d="M 50 78 L 75 65 L 100 78 Z" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" />
    <path d="M 52 78 L 45 190 L 105 190 L 98 78 Z" fill="#e11d48" opacity="0.85" />
    <!-- Collar & buttons -->
    <path d="M 68 78 L 75 92 L 82 78 Z" fill="#ffffff" />
    <line x1="75" y1="92" x2="75" y2="185" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" />

    <!-- Hanging Hanger 2: Dress -->
    <path d="M 140 60 C 140 52 150 52 150 60" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M 125 78 L 150 65 L 175 78 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <path d="M 135 78 L 132 120 L 110 230 L 190 230 L 168 120 L 165 78 Z" fill="#0284c7" opacity="0.85" />
    <!-- Belt -->
    <rect x="131" y="120" width="38" height="8" rx="2" fill="#f59e0b" />

    <!-- Hanging Hanger 3: Casual Kurti/Tee -->
    <path d="M 215 60 C 215 52 225 52 225 60" fill="none" stroke="#10b981" stroke-width="2" />
    <path d="M 200 78 L 225 65 L 250 78 Z" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
    <path d="M 202 78 L 195 170 L 255 170 L 248 78 Z" fill="#10b981" opacity="0.85" />
  </g>

  <!-- Shopping Bags in Foreground -->
  <g transform="translate(1000, 260)">
    <rect x="0" y="40" width="85" height="100" rx="8" fill="#e11d48" />
    <path d="M 25 40 C 25 15 60 15 60 40" fill="none" stroke="#ffe4e6" stroke-width="4" stroke-linecap="round" />
    <text x="42" y="95" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">VR</text>

    <!-- Smaller Bag in front -->
    <rect x="45" y="70" width="70" height="75" rx="6" fill="#f59e0b" />
    <path d="M 65 70 C 65 50 95 50 95 70" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Left Text Showcase -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffe4e6" />
    <text x="18" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e11d48" letter-spacing="1">
      ★ SRI LANKA'S FASHION HUB
    </text>

    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="800" fill="#0f172a" line-height="1.2">
      Ready-Made Clothing
    </text>
    <text x="0" y="145" font-family="'Poppins', sans-serif" font-size="44" font-weight="800" fill="#e11d48">
      From Local Sellers.
    </text>

    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="16" fill="#475569">
      Discover curated men's, women's &amp; kids' ready-to-wear garments.
    </text>
    <text x="0" y="222" font-family="'Inter', sans-serif" font-size="16" fill="#475569">
      Cash on delivery available island-wide with direct seller prices.
    </text>
  </g>
</svg>
