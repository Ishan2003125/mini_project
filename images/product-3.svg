    <circle cx="115" cy="320" r="4" /><circle cx="121" cy="320" r="4" /><circle cx="118" cy="326" r="4" />
    <circle cx="240" cy="315" r="4" /><circle cx="246" cy="315" r="4" /><circle cx="243" cy="321" r="4" />
