<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Hanger -->
  <line x1="130" y1="70" x2="270" y2="70" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <!-- Wide-Leg Linen Palazzo Pants (Olive Green) -->
  <!-- High Elastic Waistband -->
  <polygon points="140,80 260,80 265,115 135,115" fill="#3f6212" stroke="#365314" stroke-width="2" />
  <!-- Drawstring Tie -->
  <line x1="190" y1="95" x2="190" y2="125" stroke="#fef08a" stroke-width="2" />
  <line x1="210" y1="95" x2="210" y2="125" stroke="#fef08a" stroke-width="2" />
