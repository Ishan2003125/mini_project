  <path d="M 115 200 Q 130 270 120 340" fill="none" stroke="#65a30d" stroke-width="2" />
  <path d="M 285 200 Q 270 270 280 340" fill="none" stroke="#65a30d" stroke-width="2" />
  <!-- Deep Pockets -->
  <path d="M 140 125 L 165 145" stroke="#365314" stroke-width="2" />
  <path d="M 260 125 L 235 145" stroke="#365314" stroke-width="2" />
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#ecfccb" />
  <text x="62" y="36" fill="#3f6212" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">PURE LINEN</text>
</svg>
