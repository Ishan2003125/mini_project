<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Coiled Leather Belt Graphic -->
  <g transform="translate(70, 70)">
    <!-- Outer Coiled Strap -->
    <circle cx="130" cy="130" r="110" fill="none" stroke="#451a03" stroke-width="26" />
    <circle cx="130" cy="130" r="110" stroke="#78350f" stroke-width="1.5" stroke-dasharray="6 4" fill="none" />
    <!-- Inner Strap loop -->
    <circle cx="130" cy="130" r="70" fill="none" stroke="#451a03" stroke-width="26" />
    <!-- Silver Buckle attached to end -->
    <rect x="180" y="20" width="60" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="5" />
    <line x1="200" y1="20" x2="200" y2="70" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <!-- Belt holes -->
    <circle cx="60" cy="130" r="3" fill="#1c1917" />
    <circle cx="65" cy="150" r="3" fill="#1c1917" />
    <circle cx="75" cy="170" r="3" fill="#1c1917" />
  </g>
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#ffedd5" />
  <text x="62" y="36" fill="#9a3412" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">REAL LEATHER</text>
</svg>
