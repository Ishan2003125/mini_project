<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Folded Handloom Sarong -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="200" height="230" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2.5" />
    <!-- Checkered Handloom grid pattern -->
    <line x1="40" y1="0" x2="40" y2="230" stroke="#bae6fd" stroke-width="2" />
    <line x1="80" y1="0" x2="80" y2="230" stroke="#bae6fd" stroke-width="2" />
    <line x1="120" y1="0" x2="120" y2="230" stroke="#bae6fd" stroke-width="2" />
    <line x1="160" y1="0" x2="160" y2="230" stroke="#bae6fd" stroke-width="2" />
    <line x1="0" y1="50" x2="200" y2="50" stroke="#bae6fd" stroke-width="2" />
    <line x1="0" y1="100" x2="200" y2="100" stroke="#bae6fd" stroke-width="2" />
    <line x1="0" y1="150" x2="200" y2="150" stroke="#bae6fd" stroke-width="2" />
    <line x1="0" y1="200" x2="200" y2="200" stroke="#bae6fd" stroke-width="2" />
    <!-- Stitched Border Accent -->
    <rect x="0" y="210" width="200" height="20" rx="4" fill="#0c4a6e" />
    <!-- Tag band wrapped around sarong -->
    <rect x="25" y="80" width="150" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="100" y="105" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">CEYLON HANDLOOM</text>
  </g>
  <!-- Badge -->
  <rect x="20" y="20" width="90" height="24" rx="12" fill="#e0f2fe" />
  <text x="65" y="36" fill="#0369a1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">100% HANDLOOM</text>
</svg>
