<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Wedge Sandal (Side Profile) -->
  <g transform="translate(60, 110)">
    <!-- Cork Wedge Sole -->
    <path d="M 20 180 L 120 180 L 260 180 C 270 170 270 160 250 155 L 140 145 C 90 120 30 110 20 180 Z" fill="#b45309" stroke="#92400e" stroke-width="2" />
    <!-- Cork textured dots -->
    <circle cx="50" cy="145" r="2" fill="#78350f" /><circle cx="70" cy="155" r="2" fill="#78350f" /><circle cx="90" cy="165" r="2" fill="#78350f" />
    <!-- Tan Leather Front Strap -->
    <path d="M 180 150 C 190 100 230 100 240 157" fill="none" stroke="#78350f" stroke-width="22" stroke-linecap="round" />
    <!-- Ankle Arch Strap -->
    <path d="M 70 125 C 90 90 120 90 140 145" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round" />
    <!-- Gold Buckle -->
    <rect x="100" y="90" width="16" height="18" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  </g>
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#fef3c7" />
  <text x="62" y="36" fill="#b45309" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">WEDGE SANDAL</text>
</svg>
