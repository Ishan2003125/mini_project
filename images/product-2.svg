<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Hanger -->
  <path d="M 175 60 C 175 48 188 48 188 60 C 188 68 180 72 180 78" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 120 102 L 180 82 L 240 102 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <!-- Long Sleeve Linen Shirt (Off White) -->
  <path d="M 140 100 L 70 240 L 95 255 L 140 150 L 140 330 L 260 330 L 260 150 L 305 255 L 330 240 L 260 100 Z" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2" />
  <!-- Folded Collar -->
  <polygon points="170,100 200,130 180,140 145,105" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5" />
  <polygon points="230,100 200,130 220,140 255,105" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5" />
  <!-- Center Placket & Buttons -->
  <line x1="200" y1="130" x2="200" y2="330" stroke="#a8a29e" stroke-width="2" />
  <circle cx="200" cy="160" r="3" fill="#78716c" />
  <circle cx="200" cy="200" r="3" fill="#78716c" />
  <circle cx="200" cy="240" r="3" fill="#78716c" />
  <circle cx="200" cy="280" r="3" fill="#78716c" />
  <!-- Batik Pocket Motif -->
  <rect x="215" y="170" width="35" height="42" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.5" />
  <path d="M 220 185 Q 232 175 245 185" fill="none" stroke="#ea580c" stroke-width="1.5" />
  <!-- Badge -->
  <rect x="20" y="20" width="95" height="24" rx="12" fill="#ffedd5" />
  <text x="67" y="36" fill="#c2410c" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">SRI LANKAN BATIK</text>
</svg>
