<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Hanger -->
  <line x1="130" y1="70" x2="270" y2="70" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <!-- Denim Jeans Profile -->
  <!-- Waistband -->
  <polygon points="140,80 260,80 265,115 135,115" fill="#1e3a8a" stroke="#172554" stroke-width="2" />
  <circle cx="200" cy="98" r="4" fill="#d97706" />
  <!-- Belt loops -->
  <line x1="160" y1="80" x2="160" y2="115" stroke="#d97706" stroke-width="2" />
  <line x1="240" y1="80" x2="240" y2="115" stroke="#d97706" stroke-width="2" />
  <!-- Pant Legs -->
  <path d="M 135 115 L 125 330 L 175 330 L 195 190 L 205 190 L 225 330 L 275 330 L 265 115 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2" />
  <!-- Front Pockets & Coin Pocket -->
  <path d="M 140 120 C 160 120 170 145 170 160" fill="none" stroke="#d97706" stroke-width="1.8" />
  <path d="M 260 120 C 240 120 230 145 230 160" fill="none" stroke="#d97706" stroke-width="1.8" />
  <rect x="235" y="125" width="18" height="15" fill="none" stroke="#d97706" stroke-width="1.5" />
  <!-- Inseam Yellow Stitching -->
  <line x1="150" y1="190" x2="150" y2="330" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="250" y1="190" x2="250" y2="330" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" />
  <!-- Badge -->
  <rect x="20" y="20" width="85" height="24" rx="12" fill="#dbeafe" />
  <text x="62" y="36" fill="#1e40af" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" font-weight="700">STRETCH DENIM</text>
</svg>
